# Aegisky Control Tower - Production Docker Compose
# 白皮书5.3节：全栈编排
# 生产环境使用，包含Nginx SSL反向代理

version: '3.8'

services:
  # PostgreSQL 16 数据库
  postgres:
    image: postgres:16-alpine
    container_name: aegisky-postgres-prod
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: ${DB_PASSWORD:-medusa_prod_secure}
      POSTGRES_DB: medusa-aegisky
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7 缓存与队列
  redis:
    image: redis:7-alpine
    container_name: aegisky-redis-prod
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_prod_secure} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_prod_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Meilisearch 搜索引擎
  meilisearch:
    image: getmeili/meilisearch:v1.5
    container_name: aegisky-meilisearch-prod
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-aegisky-meilisearch-master-key-prod}
      MEILI_ENV: production
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meili_prod_data:/meili_data
    restart: always

  # Nginx 反向代理 (SSL终止)
  nginx:
    image: nginx:alpine
    container_name: aegisky-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/controltower.aegisky.com.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    depends_on:
      - storefront
      - backend
    restart: always

  # 后端 Medusa (端口9000)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: aegisky-backend-prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://medusa:${DB_PASSWORD:-medusa_prod_secure}@postgres:5432/medusa-aegisky
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_prod_secure}@redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILI_MASTER_KEY:-aegisky-meilisearch-master-key-prod}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      COOKIE_SECRET: ${COOKIE_SECRET:-change-me-in-production}
    ports:
      - "127.0.0.1:9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # 前端 Next.js (端口8000)
  storefront:
    build:
      context: ./storefront
      dockerfile: Dockerfile.prod
    container_name: aegisky-storefront-prod
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${PUBLISHABLE_KEY:-pk_live_xxx}
      NEXT_PUBLIC_BACKEND_URL: https://controltower.aegisky.com
      NEXT_PUBLIC_DEFAULT_REGION: us
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_prod_data:
  redis_prod_data:
  meili_prod_data:
